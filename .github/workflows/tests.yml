# The test suite (tests/ and the examples in the docstrings), on every pull request.
name: tests

on:
  pull_request:
  workflow_dispatch:  # also by hand, from the Actions page

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install TSLies and pytest
        run: pip install -e ".[test]"
      - name: Run the tests
        run: pytest -q
